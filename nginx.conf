# 1. Bloqueo de peticiones por IP directa (Zero Trust)
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate /etc/letsencrypt/live/projectsunach.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/projectsunach.dev/privkey.pem;
    server_tokens off;
    return 444;
}

# 2. Redireccion HTTP -> HTTPS
server {
    listen 80;
    server_name projectsunach.dev www.projectsunach.dev;
    server_tokens off;
    return 301 https://projectsunach.dev$request_uri;
}

# 3. Aplicacion Principal (HTTPS + Cabeceras de Seguridad Endurecidas)
server {
    listen 443 ssl;
    server_name projectsunach.dev www.projectsunach.dev;
    server_tokens off;

    # Certificados SSL Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/projectsunach.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/projectsunach.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # --- Cabeceras de Seguridad (A+ Mozilla Observatory / OWASP Top 10) ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # CSP Endurecida: Sin IPs privadas, sin unsafe-inline en scripts, con proteccion frame-ancestors y form-action
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; form-action 'self';" always;

    # --- Mitigacion de Falsos Positivos y Proteccion de Archivos Ocultos ---
    # Denegar acceso estricto con 404 real a archivos y carpetas ocultas (.git, .env, .bash_history)
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    # Denegar archivos estaticos no existentes para evitar el fallback del SPA en rutas sensibles
    location ~* \.(json|jsp|sql|bak|old|history|txt|log)$ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    # --- Enrutamiento SPA React ---
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # --- Proxy Inverso VPC Peering al Backend ---
    location /api/ {
        proxy_pass http://10.10.32.29:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
