server_tokens off;

# Bloqueo de peticiones por IP directa (Zero Trust)
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

# Redireccion HTTP -> HTTPS
server {
    listen 80;
    server_name projectsunach.dev www.projectsunach.dev;
    return 301 https://projectsunach.dev$request_uri;
}

# Aplicacion principal (HTTPS + Security Headers + VPC Peering)
server {
    listen 443 ssl;
    server_name projectsunach.dev www.projectsunach.dev;

    # Certificados SSL (Certbot los pondra aqui nativamente)
    ssl_certificate /etc/letsencrypt/live/projectsunach.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/projectsunach.dev/privkey.pem;
    
    # Security Headers para A+ en Mozilla Observatory
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' http://10.10.32.29:3000;" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    
    # Archivos estaticos de React
    location / {
        root /var/www/html/siga-frontend;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
    
    # Conexion secreta VPC Peering al Backend
    location /api/ {
        proxy_pass http://10.10.32.29:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
